<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <meta name="robots" content="noindex">
    <title>Not found - coze.org</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%230a0a0a'/%3E%3Crect%20x='5'%20y='3'%20width='6'%20height='10'%20fill='%23e0e0e0'/%3E%3C/svg%3E">
    <script>
        // Anti-flash: apply stored theme before first paint; no key means follow the system
        (function () {
            try {
                var t = localStorage.getItem('coze-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) { /* storage blocked: follow the system */ }
        })();
    </script>
    <style>
        /* Served at any wrong path: keep every URL root-absolute */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #888; /* Grey, like despair */
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme]) {
                --bg-color: #f4f2ec;
                --text-color: #1a1a1a;
                --accent-color: #6a6a6a; /* Still grey, still despair */
                color-scheme: light;
            }
        }

        [data-theme="light"] {
            --bg-color: #f4f2ec;
            --text-color: #1a1a1a;
            --accent-color: #6a6a6a;
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #888;
            color-scheme: dark;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace; /* Retro terminal vibe */
            min-height: 100vh;
            margin: 0;
            padding: 4rem 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: -2px;
            font-weight: 700;
        }

        p {
            margin: 2rem 0 0;
            font-size: 1rem;
            color: var(--accent-color);
            max-width: 600px;
            line-height: 1.6;
            border-left: 2px solid var(--accent-color);
            padding-left: 1rem;
            text-align: left;
        }

        a {
            margin-top: 2.5rem;
            border: 1px solid var(--text-color);
            padding: 1rem 2rem;
            line-height: 1.25;
            text-decoration: none;
            color: inherit;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        @media (prefers-reduced-motion: reduce) {
            a { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>coze.org</h1>
        <p>Nothing lives at this address. Nothing ever did.</p>
        <a href="/">Back to coze.org</a>
    </main>
</body>
</html>
